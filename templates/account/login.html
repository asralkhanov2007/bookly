{% extends 'base.html' %}
{% block title %}Login — Bookly{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">Welcome back</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                <input type="{{ field.field.widget.input_type }}"
                       name="{{ field.html_name }}"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                       {% if field.value %}value="{{ field.value }}"{% endif %}>
                {% if field.errors %}
                    <p class="text-red-500 text-sm mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-semibold">
            Login
        </button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-4">
        Don't have an account? <a href="/accounts/signup/" class="text-indigo-600 hover:underline">Sign up</a>
    </p>
</div>
{% endblock %}
